name: catalog-pipeline

# Daily catalog content build (PLAN-update-strategy §6).
# Fail-closed: any failure aborts and publishes nothing — the last-good
# release stays live (manifest + overlay on GitHub Pages, baseline as a
# GitHub Release asset).
#
# Host layout (no Cloudflare, no bucket, no credit card):
#   manifest.json + current overlay -> gh-pages branch (GitHub Pages)
#   baseline db (~124 MB > 100 MB git push limit) -> Release "baseline-<sha12>"
#     (Releases API: 2 GiB per asset, no bandwidth limit; uploaded only when
#      the baseline sha changes)
#
# The overlay is the CUMULATIVE diff against the last published baseline
# (the one the app holds). The baseline itself only changes on the first
# publish or a manual `rebase` dispatch (schema bump / Q3 re-bake), in
# lockstep with the app that expects it (Q5). Content days therefore publish
# only the small overlay — the app never re-downloads the 124 MB baseline.

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily (AIFA posts overnight)
  workflow_dispatch:
    inputs:
      rebase:
        description: "Publish the candidate as a NEW baseline (schema bump / periodic re-bake; pairs with a new APK)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # new repos default to read-only workflow tokens; push to gh-pages and
    # baseline release creation need contents:write
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # pipeline is stdlib-only

      # sources/.manifest.json is gitignored — restore it from the previous
      # run's artifact so --skip-unchanged can HEAD-probe and skip unchanged
      # sources instead of re-downloading the full ~100 MB every day.
      - name: Restore source manifest
        continue-on-error: true   # first run: no artifact yet
        uses: actions/download-artifact@v4
        with:
          name: source-manifest
          path: sources/

      # 1. fetch + validate sources (fail-closed, per-source staleness bands)
      #    MIBACT_PROXY (optional secret): the Mibact DISPO host is a
      #    TLS1.2-only box that can reject the runner egress; if both the
      #    urllib and curl strategies fail, set this to a residential/Italian
      #    egress proxy so the fetch can go through it.
      - name: Fetch sources
        env:
          MIBACT_PROXY: ${{ secrets.MIBACT_PROXY }}
        run: python3 scripts/download_sources.py --skip-unchanged

      # persist what finished this run (the script saves the manifest after
      # each source) so the next run can skip unchanged sources — even when
      # a later step fails
      - name: Persist source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest
          path: sources/.manifest.json
          if-no-files-found: ignore

      # 2. full candidate build
      - name: Build candidate catalog
        run: python3 scripts/build_catalog.py --db build/candidate.db

      # 3. last published state -> prev baseline + last content version
      #    (manifest lives on GitHub Pages; its baseline URL points to a
      #    release asset)
      - name: Fetch last published state
        run: |
          set -e
          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}"
          mkdir -p build
          if curl -sfL "${PAGES_BASE}/manifest.json" -o build/last_manifest.json; then
            echo "  found last manifest (cv $(python3 -c "import json;print(json.load(open('build/last_manifest.json'))['content_version'])"))"
            PREV_URL=$(python3 -c "import json;print(json.load(open('build/last_manifest.json'))['baseline']['url'])")
            # -L: release download URLs 302 to the release-assets CDN; without
            # follow curl writes the empty redirect body (sha256 mismatch)
            curl -sfL "$PREV_URL" -o build/prev.db
            sha256sum -c <(python3 -c "import json;m=json.load(open('build/last_manifest.json'));print(m['baseline']['sha256'],'build/prev.db')")
            LAST_CV=$(python3 -c "import json;print(json.load(open('build/last_manifest.json'))['content_version'])")
            echo "LAST_CV=$LAST_CV" >> "$GITHUB_ENV"
          else
            echo "  no manifest yet — first publish (overlay = views only)"
            echo "LAST_CV=0" >> "$GITHUB_ENV"
          fi

      # 4. diff vs last baseline -> overlay (exit 42 = no content change).
      #    The published baseline is the one we diffed against — NOT the
      #    candidate — so content days publish only the small overlay.
      #    (rebase dispatch: PREV=none forces candidate as new baseline.)
      - name: Diff vs last baseline
        run: |
          set -e
          if [ "${{ inputs.rebase }}" = "true" ]; then
            echo "::notice::rebase requested — new baseline = candidate"
            PREV=none
          else
            [ -f build/prev.db ] && PREV=build/prev.db || PREV=none
          fi
          # The overlay stamps content_meta.baseline_sha256 with this value;
          # the app compares it against its on-disk baseline file. So it must
          # be the sha of the PUBLISHED baseline (prev on content days), not
          # the candidate's (only prev=none publishes the candidate itself).
          if [ "$PREV" = "none" ]; then
            BSHA=$(sha256sum build/candidate.db | cut -d' ' -f1)
          else
            BSHA=$(sha256sum build/prev.db | cut -d' ' -f1)
          fi
          set +e
          python3 scripts/diff_catalog.py --prev "$PREV" \
            --cand build/candidate.db --out build/overlay.sqlite \
            --baseline-sha "$BSHA" \
            --content-version $(( LAST_CV + 1 ))
          RC=$?
          set -e
          if [ $RC -eq 42 ]; then
            echo "::notice::no content change, nothing published"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
            exit 0
          fi
          [ $RC -ne 0 ] && exit $RC
          if [ "$PREV" = "none" ]; then
            cp build/candidate.db build/published_baseline.db
          else
            cp build/prev.db build/published_baseline.db
          fi

      # 5. baseline -> release asset, only when the baseline sha is new.
      #    (~124 MB exceeds the 100 MB git push limit, so it cannot live on
      #    the Pages branch; the Releases API allows 2 GiB per asset.)
      - name: Publish baseline (release asset)
        if: env.PUBLISH != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BSHA=$(sha256sum build/published_baseline.db | cut -c1-12)
          TAG="baseline-${BSHA}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "  baseline $TAG already published"
          else
            cp build/published_baseline.db "build/${BSHA}.db"
            gh release create "$TAG" --title "catalog baseline $BSHA" \
              --notes "content-addressed catalog baseline (immutable)" "build/${BSHA}.db"
          fi
          echo "BASELINE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${BSHA}.db" >> "$GITHUB_ENV"

      # 6. stage dist/ + manifest.json (absolute URLs: baseline -> release
      #    asset, overlay -> Pages). No upload here — Pages is the host.
      - name: Stage manifest
        if: env.PUBLISH != 'false'
        run: |
          set -e
          PAGES_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}"
          python3 scripts/publish.py \
            --baseline build/published_baseline.db \
            --overlay build/overlay.sqlite \
            --base-url "$PAGES_BASE" \
            --baseline-url "$BASELINE_URL" \
            --keep-dist

      # 7. manifest + current overlay -> gh-pages branch. Fresh single-commit
      #    branch force-pushed each time (constant size, no history bloat).
      #    One-time setup: repo Settings -> Pages -> Source "Deploy from a
      #    branch" -> branch `gh-pages`, root.
      - name: Push to GitHub Pages
        if: env.PUBLISH != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TMP=$(mktemp -d)
          git init -q -b gh-pages "$TMP/pages"
          git -C "$TMP/pages" config user.name "github-actions"
          git -C "$TMP/pages" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dist/manifest.json "$TMP/pages/"
          cp -r dist/overlays "$TMP/pages/"
          git -C "$TMP/pages" add -A
          git -C "$TMP/pages" commit -qm "catalog cv$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['content_version'])")"
          git -C "$TMP/pages" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$TMP/pages" push -qf origin gh-pages
          echo "  Pages live (deploy ~1-2 min): https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY##*/}"
